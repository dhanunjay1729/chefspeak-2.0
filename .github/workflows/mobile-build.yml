name: Mobile builds

on:
  push:
    branches: [mobile-android-ios]
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix server
      - name: Restore Firebase build configuration
        env:
          MOBILE_ENV_LOCAL: ${{ secrets.MOBILE_ENV_LOCAL }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$MOBILE_ENV_LOCAL"
          test -n "$ANDROID_GOOGLE_SERVICES_JSON"
          printf '%s' "$MOBILE_ENV_LOCAL" > .env.local
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: npm test
      - run: npm run mobile:sync
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: chefspeak-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore Firebase build configuration
        env:
          MOBILE_ENV_LOCAL: ${{ secrets.MOBILE_ENV_LOCAL }}
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$MOBILE_ENV_LOCAL"
          test -n "$IOS_GOOGLE_SERVICE_INFO_PLIST"
          printf '%s' "$MOBILE_ENV_LOCAL" > .env.local
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
      - run: npm run mobile:sync
      - name: Build iOS simulator app without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj
          -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
